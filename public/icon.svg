<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="70%" stop-color="#2e3440" />
      <stop offset="100%" stop-color="#21252b" />
    </radialGradient>
    <linearGradient id="player" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa116" />
      <stop offset="40%" stop-color="#ff5722" />
      <stop offset="75%" stop-color="#e91e63" />
      <stop offset="100%" stop-color="#9c27b0" />
    </linearGradient>
    <linearGradient id="kurdishText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="50%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#e91e63" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#daa520" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- 1. Player & Ball -->
  <g filter="url(#shadow)" transform="translate(0, -8)">
    <!-- Motion Arc -->
    <path d="M 115 218 C 175 242 250 250 340 202 C 285 224 185 228 115 218 Z" fill="#ff3d00" />

    <!-- Striker Silhouette -->
    <g fill="url(#player)">
      <!-- Head -->
      <circle cx="248" cy="74" r="21" />
      <!-- Torso -->
      <path d="M 206 90 C 226 84 256 90 274 116 L 260 180 C 228 184 196 168 181 140 Z" />
      <!-- Left Arm -->
      <path d="M 176 108 L 126 98 C 114 94 106 102 112 116 L 140 146 Z" />
      <!-- Right Arm -->
      <path d="M 268 102 L 306 112 C 316 116 320 128 308 136 L 276 152 Z" />
      <!-- Kicking Leg -->
      <path d="M 254 174 L 316 156 L 384 92 L 400 110 L 344 178 L 270 194 Z" />
      <!-- Supporting Leg -->
      <path d="M 210 170 L 180 218 L 188 284 L 158 284 L 150 226 L 180 176 Z" />
    </g>

    <!-- Fiery Ball -->
    <g transform="translate(305, 55)">
      <path d="M 40 25 C 15 35 -15 20 -35 30 C -15 45 15 55 40 45 Z" fill="#ff3d00" />
      <path d="M 30 30 C 10 38 -10 28 -25 35 C -10 45 10 48 30 40 Z" fill="#ffeb3b" />
      <circle cx="35" cy="35" r="22" fill="#ffffff" stroke="#111" stroke-width="3" />
      <polygon points="35,20 45,28 42,40 28,40 25,28" fill="#111" />
    </g>
  </g>

  <!-- 2. Kurdish Text -->
  <text x="256" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="url(#kurdishText)" stroke="#21252b" stroke-width="2" text-anchor="middle" filter="url(#shadow)" direction="rtl">
    لاوانی ئاگرین
  </text>

  <!-- 3. Lion & Crown -->
  <g transform="translate(256, 360) scale(1)" filter="url(#shadow)">
    <!-- Crown -->
    <path d="M -26 -30 L -40 -62 L -13 -42 L 0 -72 L 13 -42 L 40 -62 L 26 -30 Z" fill="#ffd700" stroke="#b8860b" stroke-width="2" />
    <!-- Lion Head -->
    <path d="M -35 -28 C -35 25 -24 60 0 80 C 24 60 35 25 35 -28 Z" fill="url(#gold)" stroke="#ffd700" stroke-width="2" />
    <!-- Facial details -->
    <path d="M -12 -8 L 0 6 L 12 -8 Z" fill="#3b4252" />
    <circle cx="-10" cy="-18" r="3.5" fill="#3b4252" />
    <circle cx="10" cy="-18" r="3.5" fill="#3b4252" />
  </g>

  <!-- 4. Curved English Text -->
  <path id="lawaniPath" d="M 160 390 A 98 98 0 0 0 230 432" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#ffd700" filter="url(#shadow)">
    <textPath href="#lawaniPath" startOffset="50%" text-anchor="middle">LAWANI</textPath>
  </text>

  <path id="agrinPath" d="M 282 432 A 98 98 0 0 0 352 390" fill="none" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#ffd700" filter="url(#shadow)">
    <textPath href="#agrinPath" startOffset="50%" text-anchor="middle">AGRIN</textPath>
  </text>
</svg>

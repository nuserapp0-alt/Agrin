<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Vignette: White Center to Intense Fiery Orange Perimeter -->
    <radialGradient id="pureVignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fff8eb" />
      <stop offset="72%" stop-color="#ffa033" />
      <stop offset="88%" stop-color="#ff5900" />
      <stop offset="100%" stop-color="#e04000" />
    </radialGradient>

    <!-- Outer Canvas for maskable Android adaptive icon -->
    <radialGradient id="outerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7300" />
      <stop offset="75%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#d63b00" />
    </radialGradient>

    <!-- Striker 3D Body Gradient: Orange to Red to Hot Magenta/Pink -->
    <linearGradient id="bodyGrad" x1="40%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="25%" stop-color="#ff6600" />
      <stop offset="50%" stop-color="#ff1a00" />
      <stop offset="75%" stop-color="#e6005c" />
      <stop offset="100%" stop-color="#c2004d" />
    </linearGradient>

    <!-- Muscle Lighting Gradient -->
    <linearGradient id="muscleLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff099" />
      <stop offset="50%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#800020" />
    </linearGradient>

    <!-- Ball Fire Flare -->
    <linearGradient id="ballFlare" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffea00" />
      <stop offset="35%" stop-color="#ff5500" />
      <stop offset="75%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#7a0010" stop-opacity="0" />
    </linearGradient>

    <!-- Lion Shield Gradient -->
    <linearGradient id="lionShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef233c" />
      <stop offset="50%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#8b0014" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="elementShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#7a0000" flood-opacity="0.85" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- If maskable, solid orange fills the entire 512x512 background -->
  <rect width="512" height="512" fill="url(#outerBg)" />

  <!-- Main Scaled Group -->
  <g transform="translate(15.360000000000014, 15.360000000000014) scale(0.94)">

    <!-- Circular Badge with White-to-Orange Vignette -->
    <circle cx="256" cy="256" r="248" fill="url(#pureVignette)" />

    <!-- Subtle Outer Ring Defining Circular Shape -->
    <circle cx="256" cy="256" r="247" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.6" />

    <!-- ============================================================ -->
    <!-- 1. STRIKER FIGURINE & FIERY SOCCER BALL (TOP HALF) -->
    <!-- ============================================================ -->
    <g transform="translate(10, 8)" filter="url(#elementShadow)">
      
      <!-- Dark Red Crescent Swoosh Blade beneath kicking leg -->
      <path d="M 104 212 C 160 236 244 246 326 198 C 274 220 180 224 104 212 Z" fill="#800018" />
      <path d="M 106 211 C 160 234 242 244 324 196 C 272 217 180 221 106 211 Z" fill="#d90429" />

      <!-- Striker 3D Drop Extrusion (Gives true 3D toy/sculpture feel) -->
      <g fill="#600010" opacity="0.75">
        <circle cx="242" cy="74" r="22" />
        <path d="M 204 88 C 224 82 254 88 270 114 L 256 174 C 224 178 194 162 178 134 Z" />
        <path d="M 174 104 L 126 94 C 114 90 106 98 112 112 L 140 144 Z" />
        <path d="M 264 100 L 302 110 C 314 114 316 128 304 136 L 274 150 Z" />
        <path d="M 244 168 L 304 150 L 374 88 L 390 106 L 334 174 L 260 190 Z" />
        <path d="M 204 166 L 174 214 L 180 274 L 152 274 L 144 218 L 174 170 Z" />
      </g>

      <!-- Striker Main Gradient Body (Orange-Red-Magenta) -->
      <g fill="url(#bodyGrad)">
        <!-- Head -->
        <circle cx="240" cy="71" r="21" />
        <ellipse cx="244" cy="73" rx="15" ry="17" fill="#ffaa00" />
        
        <!-- Torso & Chest Leaning Forward -->
        <path d="M 200 84 C 222 80 250 85 264 110 L 250 170 C 220 174 190 158 175 130 Z" />
        
        <!-- Left Arm Balancing -->
        <path d="M 170 100 L 122 90 C 112 87 104 94 110 108 L 136 140 Z" />
        <circle cx="114" cy="100" r="8" fill="#ff7700" />

        <!-- Right Arm Forward in Action -->
        <path d="M 260 96 L 298 106 C 308 110 310 122 300 130 L 270 144 Z" />
        <circle cx="304" cy="116" r="8" fill="#ff4400" />

        <!-- Kicking Leg (Stretched High Towards Ball) -->
        <path d="M 240 164 L 298 146 L 368 84 L 384 100 L 328 170 L 256 186 Z" />
        <!-- Kicking Boot (Crimson/Pink) -->
        <path d="M 368 84 L 388 78 L 392 94 L 378 100 Z" fill="#d90429" />

        <!-- Trailing Leg (Bent in Leaping Motion) -->
        <path d="M 200 162 L 170 210 L 176 270 L 148 270 L 140 214 L 170 166 Z" />
        <!-- Trailing Boot (Crimson/Pink) -->
        <path d="M 176 270 L 172 284 L 142 284 L 148 270 Z" fill="#d90429" />
      </g>

      <!-- 3D Muscle Highlights -->
      <g fill="#fff099" opacity="0.8">
        <path d="M 235 58 C 245 58 252 64 254 70 C 244 64 236 62 235 58 Z" />
        <path d="M 202 86 C 220 84 240 88 250 100 C 238 92 218 90 202 86 Z" />
        <path d="M 242 164 L 300 146 L 366 88 L 360 84 L 296 142 L 242 160 Z" />
        <path d="M 170 100 L 122 90 L 124 94 L 168 103 Z" />
      </g>

      <!-- Fiery Football at the tip of the kick -->
      <g transform="translate(372, 76)">
        <!-- Fire Jet Backwards -->
        <path d="M -8 18 C -38 10 -72 25 -78 8 C -62 0 -28 -2 -8 5 Z" fill="url(#ballFlare)" />
        <path d="M -8 24 C -32 32 -56 38 -64 30 C -50 22 -22 18 -8 14 Z" fill="url(#ballFlare)" />
        <path d="M -5 12 C -24 5 -42 8 -46 2 C -36 -2 -18 0 -5 8 Z" fill="#ffea00" />

        <!-- Golden Soccer Ball -->
        <circle cx="14" cy="14" r="19" fill="#ffffff" stroke="#ff7700" stroke-width="2.5" />
        <polygon points="14,3 23,8 20,18 8,18 5,8" fill="#d90429" />
        <line x1="14" y1="3" x2="14" y2="-5" stroke="#ff7700" stroke-width="2" />
        <line x1="23" y1="8" x2="31" y2="6" stroke="#ff7700" stroke-width="2" />
        <line x1="20" y1="18" x2="26" y2="27" stroke="#ff7700" stroke-width="2" />
        <line x1="8" y1="18" x2="2" y2="27" stroke="#ff7700" stroke-width="2" />
        <line x1="5" y1="8" x2="-3" y2="6" stroke="#ff7700" stroke-width="2" />
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- 2. KURDISH NAME: لاوانی ئاگرین (3D PROMINENT CENTER) -->
    <!-- ============================================================ -->
    <g transform="translate(256, 312)" filter="url(#elementShadow)">
      <!-- Thick 3D Red Extrusion Layers (Stacked Bevel) -->
      
        <text x="3" y="7" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#7a0000" 
              text-anchor="middle"
              stroke="#590000"
              stroke-width="5"
              stroke-linejoin="round">
          لاوانی ئاگرین
        </text>
        <text x="2" y="7" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#d90429" 
              text-anchor="middle">
          لاوانی ئاگرین
        </text>
      
        <text x="3" y="6" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#7a0000" 
              text-anchor="middle"
              stroke="#590000"
              stroke-width="5"
              stroke-linejoin="round">
          لاوانی ئاگرین
        </text>
        <text x="2" y="6" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#d90429" 
              text-anchor="middle">
          لاوانی ئاگرین
        </text>
      
        <text x="3" y="5" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#7a0000" 
              text-anchor="middle"
              stroke="#590000"
              stroke-width="5"
              stroke-linejoin="round">
          لاوانی ئاگرین
        </text>
        <text x="2" y="5" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#d90429" 
              text-anchor="middle">
          لاوانی ئاگرین
        </text>
      
        <text x="3" y="4" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#7a0000" 
              text-anchor="middle"
              stroke="#590000"
              stroke-width="5"
              stroke-linejoin="round">
          لاوانی ئاگرین
        </text>
        <text x="2" y="4" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#d90429" 
              text-anchor="middle">
          لاوانی ئاگرین
        </text>
      
        <text x="3" y="3" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#7a0000" 
              text-anchor="middle"
              stroke="#590000"
              stroke-width="5"
              stroke-linejoin="round">
          لاوانی ئاگرین
        </text>
        <text x="2" y="3" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#d90429" 
              text-anchor="middle">
          لاوانی ئاگرین
        </text>
      
        <text x="3" y="2" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#7a0000" 
              text-anchor="middle"
              stroke="#590000"
              stroke-width="5"
              stroke-linejoin="round">
          لاوانی ئاگرین
        </text>
        <text x="2" y="2" 
              font-family="'Cairo', sans-serif" 
              font-size="58" 
              font-weight="900" 
              fill="#d90429" 
              text-anchor="middle">
          لاوانی ئاگرین
        </text>
      

      <!-- Red Outline Behind Yellow Front Face -->
      <text x="0" y="0" 
            font-family="'Cairo', sans-serif" 
            font-size="58" 
            font-weight="900" 
            fill="#d90429" 
            stroke="#d90429" 
            stroke-width="6" 
            stroke-linejoin="round"
            text-anchor="middle">
        لاوانی ئاگرین
      </text>

      <!-- Radiant 3D Yellow Face -->
      <text x="0" y="0" 
            font-family="'Cairo', sans-serif" 
            font-size="58" 
            font-weight="900" 
            fill="#ffea00" 
            text-anchor="middle">
        لاوانی ئاگرین
      </text>
    </g>

    <!-- ============================================================ -->
    <!-- 3. CROWNED RED LION SHIELD (LOWER CENTER) -->
    <!-- ============================================================ -->
    <g transform="translate(256, 388)" filter="url(#elementShadow)">
      <!-- Lion Shield Shadow -->
      <path d="M 0 -38 
               L 16 -46 L 22 -35 L 34 -45 L 36 -20
               C 44 -5 44 15 30 35 
               C 20 48 5 56 0 58 
               C -5 56 -20 48 -30 35 
               C -44 15 -44 -5 -36 -20 
               L -34 -45 L -22 -35 L -16 -46 Z" 
            fill="#590000" transform="translate(2, 3)" />

      <!-- Red Shield Base with 3-Spire Royal Crown -->
      <path d="M 0 -38 
               L 16 -46 L 22 -35 L 34 -45 L 36 -20
               C 44 -5 44 15 30 35 
               C 20 48 5 56 0 58 
               C -5 56 -20 48 -30 35 
               C -44 15 -44 -5 -36 -20 
               L -34 -45 L -22 -35 L -16 -46 Z" 
            fill="url(#lionShieldGrad)" 
            stroke="#ffdd00" 
            stroke-width="2.5" />

      <!-- Stylized White Lion Mask -->
      <g fill="#ffffff">
        <polygon points="0,-18 -7,-12 0,-8 7,-12" />
        <polygon points="-16,-10 -24,-2 -15,4 -8,-3" />
        <polygon points="-18,6 -26,16 -14,20 -10,12" />
        <polygon points="16,-10 24,-2 15,4 8,-3" />
        <polygon points="18,6 26,16 14,20 10,12" />
        <polygon points="-6,-2 0,-5 6,-2 4,10 0,16 -4,10" />
        <circle cx="-5" cy="-1" r="1.5" fill="#9b001a" />
        <circle cx="5" cy="-1" r="1.5" fill="#9b001a" />
        <polygon points="0,5 -3,8 3,8" fill="#9b001a" />
        <polygon points="0,20 -6,30 0,38 6,30" />
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- 4. LAWANI AGRIN ARCHED 3D TEXT (BOTTOM) -->
    <!-- ============================================================ -->
    <g filter="url(#elementShadow)">
      <path id="archCurve" d="M 120 340 C 130 465 382 465 392 340" fill="transparent" />
      
      <!-- 3D Red Extrusion Layers -->
      
        <text font-family="'Cairo', sans-serif" font-size="29" font-weight="900" letter-spacing="4" fill="#700000" text-anchor="middle">
          <textPath href="#archCurve" startOffset="50%">
            <tspan dy="5">LAWANI AGRIN</tspan>
          </textPath>
        </text>
      
        <text font-family="'Cairo', sans-serif" font-size="29" font-weight="900" letter-spacing="4" fill="#700000" text-anchor="middle">
          <textPath href="#archCurve" startOffset="50%">
            <tspan dy="4">LAWANI AGRIN</tspan>
          </textPath>
        </text>
      
        <text font-family="'Cairo', sans-serif" font-size="29" font-weight="900" letter-spacing="4" fill="#700000" text-anchor="middle">
          <textPath href="#archCurve" startOffset="50%">
            <tspan dy="3">LAWANI AGRIN</tspan>
          </textPath>
        </text>
      
        <text font-family="'Cairo', sans-serif" font-size="29" font-weight="900" letter-spacing="4" fill="#700000" text-anchor="middle">
          <textPath href="#archCurve" startOffset="50%">
            <tspan dy="2">LAWANI AGRIN</tspan>
          </textPath>
        </text>
      

      <!-- Red Outline -->
      <text font-family="'Cairo', sans-serif" font-size="29" font-weight="900" letter-spacing="4" fill="#d90429" stroke="#d90429" stroke-width="4" stroke-linejoin="round" text-anchor="middle">
        <textPath href="#archCurve" startOffset="50%">
          LAWANI AGRIN
        </textPath>
      </text>

      <!-- Radiant Yellow Top Face -->
      <text font-family="'Cairo', sans-serif" font-size="29" font-weight="900" letter-spacing="4" fill="#ffea00" text-anchor="middle">
        <textPath href="#archCurve" startOffset="50%">
          LAWANI AGRIN
        </textPath>
      </text>
    </g>

  </g>
</svg>
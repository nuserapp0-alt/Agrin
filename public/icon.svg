<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2430" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="flameOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="flameCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGlow)" />
  <circle cx="100" cy="100" r="96" stroke="url(#goldRing)" stroke-width="4" />
  <circle cx="100" cy="100" r="90" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7" />

  <!-- Top Text: LAWANI AGRIN -->
  <path id="curveTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="transparent" />
  <text font-size="11" font-weight="900" fill="#fde047" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#curveTop" startOffset="50%">LAWANI AGRIN • FC</textPath>
  </text>

  <!-- Fiery Wings / Flame -->
  <path d="M100 28 C115 50 135 65 130 95 C125 118 105 130 100 135 C95 130 75 118 70 95 C65 65 85 50 100 28 Z" fill="url(#flameOuter)" opacity="0.95" />
  <path d="M100 45 C110 62 122 75 118 95 C114 112 104 120 100 124 C96 120 86 112 82 95 C78 75 90 62 100 45 Z" fill="url(#flameCore)" />

  <!-- Ball -->
  <g transform="translate(130, 68)">
    <circle cx="12" cy="12" r="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <path d="M12 4 L17 9 L15 15 L9 15 L7 9 Z" fill="#1e232d" />
    <path d="M12 4 L12 0 M17 9 L22 8 M15 15 L18 20 M9 15 L6 20 M7 9 L2 8" stroke="#1e232d" stroke-width="1.5" />
    <path d="M-6 8 C-1 9 4 10 7 11 C3 14 -2 15 -6 16 C-2 13 -3 10 -6 8 Z" fill="#f97316" />
  </g>

  <!-- Striker Player Silhouette -->
  <circle cx="82" cy="74" r="7" fill="#fbbf24" />
  <path d="M78 83 C84 81 92 84 94 92 L91 106 C84 107 77 104 74 96 Z" fill="#fef08a" />
  <path d="M75 87 L62 82 C60 81 58 83 59 86 L66 94 Z" fill="#fbbf24" />
  <path d="M93 86 L104 88 C106 88 107 91 105 93 L97 99 Z" fill="#fbbf24" />
  <path d="M78 105 L72 120 L76 135 L82 135 L80 122 L86 107 Z" fill="#fef08a" />
  <path d="M89 105 L108 100 L126 84 L130 89 L114 109 L94 112 Z" fill="#fbbf24" />

  <!-- Club Name Ribbon -->
  <rect x="36" y="142" width="128" height="26" rx="8" fill="#1e232d" stroke="#f59e0b" stroke-width="1.5" />
  <text x="100" y="159" font-size="13" font-weight="900" fill="#fde047" text-anchor="middle" dominant-baseline="middle">
    لاوانی ئاگرین
  </text>
  
  <!-- Est 2018 -->
  <text x="100" y="186" font-size="9" font-weight="800" fill="#f59e0b" text-anchor="middle">
    EST. 2018
  </text>
</svg>
